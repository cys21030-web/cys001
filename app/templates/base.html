<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ToF Gesture Classification{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('ui.static', filename='style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">ToF Classifier</a>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link">Dashboard</a></li>
                <li><a href="/collect" class="nav-link">Collect Data</a></li>
                <li><a href="/train" class="nav-link">Train Model</a></li>
                <li><a href="/inference" class="nav-link">Inference</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 ToF Gesture Classification System</p>
    </footer>

    <script src="{{ url_for('ui.static', filename='script.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
