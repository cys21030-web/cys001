{% extends "base.html" %}

{% block title %}Collect Data - ToF Classifier{% endblock %}

{% block content %}
<div class="collect-page">
    <h1>Collect Training Data</h1>

    <div class="main-grid">
        <div class="sensor-view">
            <h2>Live Sensor Stream</h2>
            <div class="visualization-container">
                <div id="heat-map" class="heat-map">
                    <!-- 8x8 grid will be rendered here -->
                </div>
                <div class="controls">
                    <label>
                        <input type="checkbox" id="show-point-cloud" checked> Show Point Cloud
                    </label>
                </div>
                <canvas id="point-cloud-canvas" width="600" height="400"></canvas>
            </div>
        </div>

        <div class="control-panel">
            <h2>Label & Capture</h2>
            
            <div class="label-selector">
                <label>Select Label:</label>
                <select id="label-select">
                    <option value="">-- Choose --</option>
                    <option value="Normal">Normal</option>
                    <option value="Upstairs">Upstairs</option>
                    <option value="Downstairs">Downstairs</option>
                </select>
            </div>

            <button id="snapshot-btn" class="btn btn-primary" disabled>
                📸 Take Snapshot
            </button>

            <hr>

            <h2>Collected Samples</h2>
            <div id="sample-list" class="sample-list">
                <p class="placeholder">No samples collected</p>
            </div>

            <div class="bulk-actions">
                <button id="export-btn" class="btn btn-secondary" disabled>
                    📦 Export Selected
                </button>
                <button id="delete-selected-btn" class="btn btn-danger" disabled>
                    🗑️ Delete Selected
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let sensorDataBuffer = null;
    let selectedSamples = new Set();

    document.addEventListener('DOMContentLoaded', () => {
        setupEventListeners();
        refreshSampleList();
        startSensorStream();
    });

    function setupEventListeners() {
        document.getElementById('label-select').addEventListener('change', (e) => {
            document.getElementById('snapshot-btn').disabled = !e.target.value;
        });

        document.getElementById('snapshot-btn').addEventListener('click', takeSnapshot);
        document.getElementById('export-btn').addEventListener('click', exportSelected);
        document.getElementById('delete-selected-btn').addEventListener('click', deleteSelected);
        document.getElementById('show-point-cloud').addEventListener('change', updateVisualization);
    }

    function startSensorStream() {
        // In real implementation, would use EventSource for streaming
        // For demo, update visualization at intervals
        setInterval(updateVisualization, 100);
    }

    function updateVisualization() {
        // TODO: Update 8x8 heat map and point cloud
        // This would render the current sensor data
    }

    async function takeSnapshot() {
        const label = document.getElementById('label-select').value;
        if (!label) {
            alert('Please select a label');
            return;
        }

        try {
            const response = await fetch('/api/snapshot/take', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ label })
            });

            if (!response.ok) throw new Error('Failed to take snapshot');
            
            const result = await response.json();
            alert(`Snapshot saved: ${result.timestamp}`);
            refreshSampleList();
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    async function refreshSampleList() {
        try {
            const response = await fetch('/api/snapshot/list');
            const snapshots = await response.json();

            const container = document.getElementById('sample-list');
            let html = '';

            for (const [label, files] of Object.entries(snapshots)) {
                for (const file of files) {
                    const key = `${label}/${file}`;
                    html += `
                        <div class="sample-item">
                            <input type="checkbox" class="sample-checkbox" value="${key}">
                            <div class="sample-info">
                                <span class="label-badge">${label}</span>
                                <span class="filename">${file}</span>
                            </div>
                            <button class="btn-small" onclick="viewSample('${label}', '${file}')">View</button>
                        </div>
                    `;
                }
            }

            if (html === '') {
                html = '<p class="placeholder">No samples collected</p>';
            }

            container.innerHTML = html;

            // Update bulk action buttons
            document.querySelectorAll('.sample-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', updateBulkActions);
            });
        } catch (error) {
            console.error('Error refreshing samples:', error);
        }
    }

    function updateBulkActions() {
        const checkedCount = document.querySelectorAll('.sample-checkbox:checked').length;
        document.getElementById('export-btn').disabled = checkedCount === 0;
        document.getElementById('delete-selected-btn').disabled = checkedCount === 0;
    }

    function viewSample(label, filename) {
        // TODO: Open modal with sample details
        console.log(`View: ${label}/${filename}`);
    }

    async function exportSelected() {
        const selected = Array.from(document.querySelectorAll('.sample-checkbox:checked'))
            .map(cb => cb.value);
        
        if (selected.length === 0) return;

        try {
            const response = await fetch('/api/snapshot/export', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ snapshots: selected })
            });

            if (!response.ok) throw new Error('Export failed');
            alert('Export started');
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    function deleteSelected() {
        if (!confirm('Delete selected samples?')) return;
        // TODO: Implement delete
        alert('Delete not yet implemented');
    }
</script>
{% endblock %}
